[project]
name = "content-radar"
version = "0.1.0"
description = "Trend radar, own-channel monitoring, and sponsor research for a small YouTube/TikTok/Instagram content operation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "google-api-python-client>=2.180,<3",
  "pydantic>=2.9,<3",
  "click>=8.1,<9",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]

[project.scripts]
content-radar = "content_radar.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
